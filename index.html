<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>จัดการงาน TikTok</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}
header{background:linear-gradient(135deg,#141414,#29252c);color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#aaa;font-size:13px}
nav{display:flex;gap:7px;padding:12px;overflow:auto;position:sticky;top:0;z-index:10;background:#f7f5fa}nav button{white-space:nowrap;border:0;background:#fff;border-radius:13px;padding:10px 14px;font-weight:800}nav button.active{background:#171717;color:#fff}
main{max-width:920px;margin:auto;padding:6px 14px 40px}.card{background:#fff;border:1px solid #ece9ef;border-radius:19px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #00000007}
.hero{background:#171717;color:#fff;border-radius:22px;padding:20px;margin:8px 0 12px}.hero h2{margin:0 0 4px}.hero p{margin:0;color:#aaa}.add,.save,.secondary{border:0;border-radius:12px;padding:11px 15px;font-weight:850}.add{background:#fff;color:#111;margin-top:15px}.save{background:#171717;color:#fff}.secondary{background:#eee}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fff;border:1px solid #ece9ef;border-radius:17px;padding:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#85818a}
.title{font-size:18px;font-weight:850;margin:18px 2px 8px}.job{background:#fff;border:1px solid #e9e6ed;border-radius:18px;margin:10px 0;overflow:hidden}.jobbar{height:7px}.jobbody{padding:14px}.job h3{margin:0;font-size:17px}.muted,.meta{color:#777;font-size:12px;line-height:1.8}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.badge{font-size:11px;font-weight:850;padding:5px 8px;border-radius:9px;background:#eee}.today{background:#fff0d2;color:#916000}.late{background:#ffe3e3;color:#a51e1e}.done{background:#e3f7eb;color:#176d3b}
.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;border-radius:99px}.progressrow{display:flex;justify-content:space-between;font-size:11px;color:#777;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#666;font-weight:800;margin:8px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font:inherit}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;border:1px solid #e5e1e9;background:#fff;border-radius:11px;padding:8px 11px;font-weight:750}.tabs button.on{background:#171717;color:#fff}
.board{display:grid;grid-template-columns:repeat(4,210px);gap:9px;overflow:auto}.column{background:#f0eef3;border-radius:16px;padding:10px}.mini{background:#fff;border-radius:13px;padding:10px;margin:7px 0;border-left:5px solid #888}.mini small{display:block;color:#888;margin-top:4px}.empty{text-align:center;color:#999;padding:30px}.link{color:#6046d9;word-break:break-all}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>จัดการงาน TikTok</h1><p>วางแผน • เตรียมงาน • ลงคลิป • ติดตามผล</p></header>
<nav id="nav">
<button data-page="home" class="active">หน้าหลัก</button><button data-page="all">งานทั้งหมด</button><button data-page="board">บอร์ดงาน</button><button data-page="calendar">ปฏิทิน</button><button data-page="closed">ปิดงาน</button><button data-page="settings">ตั้งค่า</button>
</nav>
<main id="app"></main>
<script>
"use strict";
const KEY="tiktok_manager_fixed_v1";
let jobs=[];let editingId=null;
try{jobs=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(jobs))jobs=[]}catch(e){jobs=[]}
const app=document.getElementById("app"), nav=document.getElementById("nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const progress={วางแผน:25,"กำลังเตรียม":50,"พร้อมลง":75,"ลงแล้ว":100};
const colors={วางแผน:"#7c5cff","กำลังเตรียม":"#4b8df8","พร้อมลง":"#f39a38","ลงแล้ว":"#35a866"};
function save(){localStorage.setItem(KEY,JSON.stringify(jobs))}
function today(){return new Date().toISOString().slice(0,10)}
function remain(d){return d?Math.ceil((new Date(d+"T23:59:59")-new Date())/86400000):0}
function dateBadge(j){if(j.status==="ลงแล้ว")return '<span class="badge done">ลงแล้ว</span>';let d=remain(j.postDate);if(d===0)return '<span class="badge today">ลงวันนี้</span>';if(d>0)return '<span class="badge today">เหลือ '+d+' วัน</span>';return '<span class="badge late">เลยกำหนด '+Math.abs(d)+' วัน</span>'}
function show(name,button){nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));if(button)button.classList.add("active");({home,all,board,calendar,closed,settings}[name]||home)()}
nav.addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)show(b.dataset.page,b)});
function jobCard(j){let p=progress[j.status]||0,c=colors[j.status]||"#888";return '<div class="job"><div class="jobbar" style="background:'+c+'"></div><div class="jobbody"><h3>'+esc(j.title)+'</h3><div class="muted">'+esc(j.product||"ไม่ระบุสินค้า")+'</div><div class="badges"><span class="badge" style="background:'+c+'18;color:'+c+'">'+esc(j.status)+'</span>'+dateBadge(j)+'</div><div class="meta">📌 กำหนดส่งงาน: <b>'+esc(j.deadline)+'</b><br>📅 วันลงคลิป: <b>'+esc(j.postDate)+'</b></div><div class="progress"><i style="width:'+p+'%;background:'+c+'"></i></div><div class="progressrow"><span>ความคืบหน้า</span><b>'+p+'%</b></div><div class="meta">👀 '+Number(j.views||0).toLocaleString()+' วิว · 🛒 '+Number(j.orders||0).toLocaleString()+' ออเดอร์</div><div class="actions"><button class="secondary edit" data-id="'+esc(j.id)+'">แก้ไข</button><button class="secondary delete" data-id="'+esc(j.id)+'">ลบ</button></div></div></div>'}
function home(){let a=jobs.filter(j=>j.status!=="ลงแล้ว").sort((x,y)=>(x.postDate||"").localeCompare(y.postDate||""));app.innerHTML='<div class="hero"><h2>งานต้องทำอะไรต่อ?</h2><p>ใส่งาน → กำหนดวัน → เดินงาน → ลงคลิป</p><button class="add" id="addHome">+ เพิ่มงาน</button></div><div class="stats"><div class="stat"><b>'+a.length+'</b><span>กำลังทำ</span></div><div class="stat"><b>'+jobs.filter(j=>j.postDate===today()).length+'</b><span>ลงวันนี้</span></div><div class="stat"><b>'+jobs.filter(j=>remain(j.postDate)<0&&j.status!=="ลงแล้ว").length+'</b><span>เลยกำหนด</span></div><div class="stat"><b>'+jobs.filter(j=>j.status==="ลงแล้ว").length+'</b><span>ปิดแล้ว</span></div></div><div class="title">งานที่ต้องดู</div>'+(a.length?a.slice(0,8).map(jobCard).join(""):'<div class="card empty">ยังไม่มีงานที่ต้องทำ</div>');bindJobButtons();document.getElementById("addHome").onclick=()=>form()}
function all(){app.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>งานทั้งหมด '+jobs.length+' งาน</b><button class="add" id="addAll" style="margin:0;background:#171717;color:#fff">+ เพิ่มงาน</button></div><div class="tabs">'+["ทั้งหมด","วางแผน","กำลังเตรียม","พร้อมลง","ลงแล้ว"].map((s,i)=>'<button class="'+(i===0?"on":"")+'" data-filter="'+s+'">'+s+'</button>').join("")+'</div><div id="list">'+(jobs.length?jobs.map(jobCard).join(""):'<div class="empty">ยังไม่มีงาน</div>')+'</div></div>';document.getElementById("addAll").onclick=()=>form();document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>filterJobs(b.dataset.filter,b));bindJobButtons()}
function filterJobs(s,b){document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("on"));b.classList.add("on");let a=s==="ทั้งหมด"?jobs:jobs.filter(j=>j.status===s);document.getElementById("list").innerHTML=a.length?a.map(jobCard).join(""):'<div class="empty">ไม่มีงานในสถานะนี้</div>';bindJobButtons()}
function board(){let ss=["วางแผน","กำลังเตรียม","พร้อมลง","ลงแล้ว"];app.innerHTML='<div class="card"><b>บอร์ดงาน</b><div class="board">'+ss.map(s=>'<div class="column"><b>'+s+' · '+jobs.filter(j=>j.status===s).length+'</b>'+jobs.filter(j=>j.status===s).map(j=>'<div class="mini" style="border-left-color:'+colors[s]+'"><b>'+esc(j.title)+'</b><small>ส่ง '+esc(j.deadline)+'</small><small>ลง '+esc(j.postDate)+'</small><small>'+progress[s]+'%</small></div>').join("")||'<small>ไม่มีงาน</small>'+'</div>').join("")+'</div></div>'}
function calendar(){let ds=[...new Set(jobs.map(j=>j.postDate).filter(Boolean))].sort();app.innerHTML='<div class="card"><b>ปฏิทินวันลงคลิป</b>'+(ds.length?ds.map(d=>'<div style="padding:13px 0;border-bottom:1px solid #eee"><b>'+d+'</b>'+jobs.filter(j=>j.postDate===d).map(j=>'<div style="margin-top:7px">'+dateBadge(j)+' '+esc(j.title)+'</div>').join("")+'</div>').join(""):'<div class="empty">ยังไม่มีวันลงคลิป</div>')+'</div>'}
function closed(){let a=jobs.filter(j=>j.status==="ลงแล้ว");app.innerHTML='<div class="card"><b>งานที่ปิดแล้ว · '+a.length+' งาน</b>'+(a.length?a.map(jobCard).join(""):'<div class="empty">ยังไม่มีงานที่ปิดแล้ว</div>');bindJobButtons()}
function settings(){app.innerHTML='<div class="card"><b>ตั้งค่า</b><p style="color:#777;font-size:13px">ข้อมูลเก็บในเครื่องนี้ ไม่ต้องเข้าสู่ระบบ</p><button class="secondary" id="backup">สำรองข้อมูล</button> <button class="secondary" id="restoreBtn">นำข้อมูลกลับคืน</button><input id="restoreFile" type="file" accept=".json" style="display:none"></div>';document.getElementById("backup").onclick=backup;document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();document.getElementById("restoreFile").onchange=restore}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:"application/json"}));a.download="tiktok-manager-backup.json";document.body.appendChild(a);a.click();a.remove()}
function restore(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();jobs=x;save();home();alert("นำข้อมูลกลับคืนแล้ว")}catch(err){alert("ไฟล์ไม่ถูกต้อง")}};r.readAsText(f)}
function form(j={}){editingId=j.id||null;app.innerHTML='<div class="card"><h2>'+ (editingId?"แก้ไขงาน":"เพิ่มงาน") +'</h2><div class="formgrid"><div><label>ชื่องาน / ชื่อคลิป *</label><input id="fTitle" value="'+esc(j.title)+'"></div><div><label>สินค้า / แบรนด์</label><input id="fProduct" value="'+esc(j.product)+'"></div><div><label>กำหนดวันส่งงาน *</label><input id="fDeadline" type="date" value="'+(j.deadline||"")+'"></div><div><label>วันลงคลิป *</label><input id="fPostDate" type="date" value="'+(j.postDate||"")+'"></div><div><label>สถานะงาน</label><select id="fStatus"><option>วางแผน</option><option>กำลังเตรียม</option><option>พร้อมลง</option><option>ลงแล้ว</option></select></div><div><label>ยอดวิว</label><input id="fViews" type="number" min="0" value="'+(j.views||0)+'"></div><div><label>ออเดอร์</label><input id="fOrders" type="number" min="0" value="'+(j.orders||0)+'"></div><div><label>ลิงก์สินค้า</label><input id="fProductLink" value="'+esc(j.productLink)+'"></div><div><label>ลิงก์คลิป</label><input id="fClipLink" value="'+esc(j.clipLink)+'"></div><div><label>GEN Code</label><input id="fGen" value="'+esc(j.gen)+'"></div></div><label>หมายเหตุ</label><textarea id="fNote" rows="3">'+esc(j.note)+'</textarea><div class="actions"><button class="save" id="saveJob">บันทึกงาน</button><button class="secondary" id="cancelJob">ยกเลิก</button></div></div>';if(j.status)document.getElementById("fStatus").value=j.status;document.getElementById("saveJob").onclick=saveForm;document.getElementById("cancelJob").onclick=all}
function saveForm(){let j={id:editingId||String(Date.now()),title:document.getElementById("fTitle").value.trim(),product:document.getElementById("fProduct").value.trim(),deadline:document.getElementById("fDeadline").value,postDate:document.getElementById("fPostDate").value,status:document.getElementById("fStatus").value,views:document.getElementById("fViews").value,orders:document.getElementById("fOrders").value,productLink:document.getElementById("fProductLink").value.trim(),clipLink:document.getElementById("fClipLink").value.trim(),gen:document.getElementById("fGen").value.trim(),note:document.getElementById("fNote").value};if(!j.title||!j.deadline||!j.postDate){alert("กรุณากรอกชื่องาน กำหนดวันส่งงาน และวันลงคลิป");return}jobs=editingId?jobs.map(x=>x.id===editingId?j:x):[...jobs,j];save();all()}
function bindJobButtons(){document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>form(jobs.find(j=>j.id===b.dataset.id)||{}));document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>{if(confirm("ต้องการลบงานนี้ใช่ไหม?")){jobs=jobs.filter(j=>j.id!==b.dataset.id);save();all()}})}
home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
