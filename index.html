<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><title>จัดการงาน TikTok</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}header{background:linear-gradient(135deg,#141414,#29252c);color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#aaa;font-size:13px}nav{display:flex;gap:7px;padding:12px;overflow:auto;position:sticky;top:0;z-index:10;background:#f7f5fa}nav button,.secondary{border:0;background:#fff;border-radius:13px;padding:10px 14px;font-weight:800}nav button.active{background:#171717;color:#fff}main{max-width:920px;margin:auto;padding:6px 14px 40px}.card,.job{background:#fff;border:1px solid #ece9ef;border-radius:19px;box-shadow:0 5px 18px #00000007}.card{padding:15px;margin:10px 0}.hero{background:#171717;color:#fff;border-radius:22px;padding:20px;margin:8px 0 12px}.hero h2{margin:0 0 4px}.hero p{margin:0;color:#aaa}.add,.save{border:0;border-radius:12px;padding:11px 16px;font-weight:850}.add{background:#fff;color:#111;margin-top:15px}.save{background:#171717;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fff;border:1px solid #ece9ef;border-radius:17px;padding:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#85818a}.title{font-size:18px;font-weight:850;margin:18px 2px 8px}.job{margin:10px 0;overflow:hidden}.jobbar{height:7px}.jobbody{padding:14px}.job h3{margin:0;font-size:17px}.muted,.meta{color:#777;font-size:12px;line-height:1.8}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.badge{font-size:11px;font-weight:850;padding:5px 8px;border-radius:9px;background:#eee}.today{background:#fff0d2;color:#916000}.late{background:#ffe3e3;color:#a51e1e}.done{background:#e3f7eb;color:#176d3b}.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;border-radius:99px}.progressrow{display:flex;justify-content:space-between;font-size:11px;color:#777;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#666;font-weight:800;margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font:inherit}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;border:1px solid #e5e1e9;background:#fff;border-radius:11px;padding:8px 11px;font-weight:750}.tabs button.on{background:#171717;color:#fff}.board{display:grid;grid-template-columns:repeat(4,210px);gap:9px;overflow:auto}.column{background:#f0eef3;border-radius:16px;padding:10px}.mini{background:#fff;border-radius:13px;padding:10px;margin:7px 0;border-left:5px solid #888}.mini small{display:block;color:#888;margin-top:4px}.empty{text-align:center;color:#999;padding:30px}.link{color:#6046d9;word-break:break-all}@media(max-width:650px){.formgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>จัดการงาน TikTok</h1><p>วางแผน • เตรียมงาน • ลงคลิป • ติดตามผล</p></header>
<nav id="nav"><button class="active" onclick="go('home',this)">หน้าหลัก</button><button onclick="go('all',this)">งานทั้งหมด</button><button onclick="go('board',this)">บอร์ดงาน</button><button onclick="go('calendar',this)">ปฏิทิน</button><button onclick="go('closed',this)">ปิดงาน</button><button onclick="go('settings',this)">ตั้งค่า</button></nav><main id="app"></main>
<script>
const K="tiktok_manager_final_v1";let jobs=JSON.parse(localStorage.getItem(K)||"[]"),editing=null;const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),P=s=>({วางแผน:25,"กำลังเตรียม":50,"พร้อมลง":75,"ลงแล้ว":100}[s]||0),C=s=>({วางแผน:"#7c5cff","กำลังเตรียม":"#4b8df8","พร้อมลง":"#f39a38","ลงแล้ว":"#35a866"}[s]||"#888");function save(){localStorage.setItem(K,JSON.stringify(jobs))}function today(){return new Date().toISOString().slice(0,10)}function rem(d){return d?Math.ceil((new Date(d+"T23:59:59")-new Date())/86400000):0}function db(j){if(j.status==="ลงแล้ว")return'<span class="badge done">ลงแล้ว</span>';let d=rem(j.postDate);return d===0?'<span class="badge today">ลงวันนี้</span>':d>0?`<span class="badge today">เหลือ ${d} วัน</span>`:`<span class="badge late">เลยกำหนด ${Math.abs(d)} วัน</span>`}
function go(p,b){document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b&&b.classList.add("active");({home,all,board,calendar,closed,settings}[p])()}
function card(j){let p=P(j.status),c=C(j.status);return`<div class="job"><div class="jobbar" style="background:${c}"></div><div class="jobbody"><h3>${esc(j.title)}</h3><div class="muted">${esc(j.product||"ไม่ระบุสินค้า")}</div><div class="badges"><span class="badge" style="background:${c}18;color:${c}">${esc(j.status)}</span>${db(j)}</div><div class="meta">📌 กำหนดส่งงาน: <b>${j.deadline}</b><br>📅 วันลงคลิป: <b>${j.postDate}</b></div><div class="progress"><i style="width:${p}%;background:${c}"></i></div><div class="progressrow"><span>ความคืบหน้า</span><b>${p}%</b></div><div class="meta">👀 ${Number(j.views||0).toLocaleString()} วิว · 🛒 ${Number(j.orders||0).toLocaleString()} ออเดอร์</div>${j.productLink?`<div class="meta">🔗 <span class="link">${esc(j.productLink)}</span></div>`:""}${j.clipLink?`<div class="meta">🎬 <span class="link">${esc(j.clipLink)}</span></div>`:""}${j.gen?`<div class="meta">🔑 GEN Code: <b>${esc(j.gen)}</b></div>`:""}<div class="actions"><button class="secondary" onclick="edit('${j.id}')">แก้ไข</button><button class="secondary" onclick="del('${j.id}')">ลบ</button></div></div></div>`}
function home(){let a=jobs.filter(j=>j.status!=="ลงแล้ว").sort((x,y)=>(x.postDate||"").localeCompare(y.postDate||""));app.innerHTML=`<div class="hero"><h2>งานต้องทำอะไรต่อ?</h2><p>ใส่งาน → กำหนดวัน → เดินงาน → ลงคลิป</p><button class="add" onclick="form()">+ เพิ่มงาน</button></div><div class="stats"><div class="stat"><b>${a.length}</b><span>กำลังทำ</span></div><div class="stat"><b>${jobs.filter(j=>j.postDate===today()).length}</b><span>ลงวันนี้</span></div><div class="stat"><b>${jobs.filter(j=>rem(j.postDate)<0&&j.status!=="ลงแล้ว").length}</b><span>เลยกำหนด</span></div><div class="stat"><b>${jobs.filter(j=>j.status==="ลงแล้ว").length}</b><span>ปิดแล้ว</span></div></div><div class="title">งานที่ต้องดู</div>${a.length?a.slice(0,8).map(card).join(""):'<div class="card empty">ยังไม่มีงานที่ต้องทำ</div>'}`}
function all(){app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>งานทั้งหมด ${jobs.length} งาน</b><button class="add" style="margin:0;background:#171717;color:#fff" onclick="form()">+ เพิ่มงาน</button></div><div class="tabs">${["ทั้งหมด","วางแผน","กำลังเตรียม","พร้อมลง","ลงแล้ว"].map((s,i)=>`<button class="${i?"":"on"}" onclick="filter('${s}',this)">${s}</button>`).join("")}</div><div id="list">${jobs.length?jobs.map(card).join(""):'<div class="empty">ยังไม่มีงาน</div>'}</div></div>`}
function filter(s,b){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");let a=s==="ทั้งหมด"?jobs:jobs.filter(j=>j.status===s);$("list").innerHTML=a.length?a.map(card).join(""):'<div class="empty">ไม่มีงานในสถานะนี้</div>'}
function board(){let ss=["วางแผน","กำลังเตรียม","พร้อมลง","ลงแล้ว"];app.innerHTML=`<div class="card"><b>บอร์ดงาน</b><div class="board">${ss.map(s=>`<div class="column"><b>${s} · ${jobs.filter(j=>j.status===s).length}</b>${jobs.filter(j=>j.status===s).map(j=>`<div class="mini" style="border-left-color:${C(s)}"><b>${esc(j.title)}</b><small>ส่ง ${j.deadline}</small><small>ลง ${j.postDate}</small><small>${P(s)}%</small></div>`).join("")||'<small>ไม่มีงาน</small>'}</div>`).join("")}</div></div>`}
function calendar(){let ds=[...new Set(jobs.map(j=>j.postDate).filter(Boolean))].sort();app.innerHTML=`<div class="card"><b>ปฏิทินวันลงคลิป</b>${ds.length?ds.map(d=>`<div style="padding:13px 0;border-bottom:1px solid #eee"><b>${d}</b>${jobs.filter(j=>j.postDate===d).map(j=>`<div style="margin-top:7px">${db(j)} ${esc(j.title)}</div>`).join("")}</div>`).join(""):'<div class="empty">ยังไม่มีวันลงคลิป</div>'}</div>`}
function closed(){let a=jobs.filter(j=>j.status==="ลงแล้ว");app.innerHTML=`<div class="card"><b>งานที่ปิดแล้ว · ${a.length} งาน</b>${a.length?a.map(card).join(""):'<div class="empty">ยังไม่มีงานที่ปิดแล้ว</div>'}</div>`}
function settings(){app.innerHTML=`<div class="card"><b>ตั้งค่า</b><p style="color:#777;font-size:13px">ข้อมูลเก็บไว้ในเครื่องนี้ ไม่ต้องเข้าสู่ระบบ</p><button class="secondary" onclick="backup()">สำรองข้อมูล</button> <button class="secondary" onclick="$('rf').click()">นำข้อมูลกลับคืน</button><input id="rf" type="file" accept=".json" style="display:none" onchange="restore(event)"></div>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:"application/json"}));a.download="tiktok-manager-backup.json";a.click()}
function restore(e){let r=new FileReader;r.onload=()=>{try{jobs=JSON.parse(r.result);save();alert("นำข้อมูลกลับคืนแล้ว");home()}catch{alert("ไฟล์ไม่ถูกต้อง")}};r.readAsText(e.target.files[0])}
function form(j={}){editing=j.id||null;app.innerHTML=`<div class="card"><h2>${editing?"แก้ไขงาน":"เพิ่มงาน"}</h2><div class="formgrid"><div><label>ชื่องาน / ชื่อคลิป *</label><input id="title" value="${esc(j.title)}"></div><div><label>สินค้า / แบรนด์</label><input id="product" value="${esc(j.product)}"></div><div><label>กำหนดวันส่งงาน *</label><input id="deadline" type="date" value="${j.deadline||""}"></div><div><label>วันลงคลิป *</label><input id="postDate" type="date" value="${j.postDate||""}"></div><div><label>สถานะงาน</label><select id="status"><option>วางแผน</option><option>กำลังเตรียม</option><option>พร้อมลง</option><option>ลงแล้ว</option></select></div><div><label>ยอดวิว</label><input id="views" type="number" value="${j.views||0}"></div><div><label>ออเดอร์</label><input id="orders" type="number" value="${j.orders||0}"></div><div><label>ลิงก์สินค้า</label><input id="productLink" value="${esc(j.productLink)}"></div><div><label>ลิงก์คลิป</label><input id="clipLink" value="${esc(j.clipLink)}"></div><div><label>GEN Code</label><input id="gen" value="${esc(j.gen)}"></div></div><label>หมายเหตุ</label><textarea id="note" rows="3">${esc(j.note)}</textarea><div class="actions"><button class="save" onclick="saveForm()">บันทึกงาน</button><button class="secondary" onclick="all()">ยกเลิก</button></div></div>`;if(j.status)$("status").value=j.status}
function saveForm(){let j={id:editing||Date.now().toString(),title:$("title").value.trim(),product:$("product").value.trim(),deadline:$("deadline").value,postDate:$("postDate").value,status:$("status").value,views:$("views").value,orders:$("orders").value,productLink:$("productLink").value.trim(),clipLink:$("clipLink").value.trim(),gen:$("gen").value.trim(),note:$("note").value};if(!j.title||!j.deadline||!j.postDate){alert("กรุณากรอกชื่องาน กำหนดวันส่งงาน และวันลงคลิป");return}jobs=editing?jobs.map(x=>x.id===editing?j:x):[...jobs,j];save();all()}
function edit(id){form(jobs.find(x=>x.id===id)||{})}function del(id){if(confirm("ต้องการลบงานนี้ใช่ไหม?")){jobs=jobs.filter(x=>x.id!==id);save();all()}}home();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
